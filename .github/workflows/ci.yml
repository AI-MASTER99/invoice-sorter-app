name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invoiceflow
    env:
      # main.py refuses to import without these. The values are dummies:
      # the unit tests never reach Supabase or Anthropic. The Supabase URL
      # points at a closed local port so the deferred startup sweep fails
      # fast instead of waiting on DNS.
      SUPABASE_URL: http://127.0.0.1:9
      SUPABASE_KEY: ci-dummy-service-key
      SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_JWT_SECRET: ci-dummy-jwt-secret-ci-dummy-jwt-secret
      SECRET_KEY: ci-dummy-secret-key-long-enough-for-the-startup-check-0123456789
      APP_PASSWORD: ci-dummy-password
      ANTHROPIC_API_KEY: sk-ant-ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: invoiceflow/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pyflakes
        run: python -m pyflakes *.py ../scripts/*.py
      - name: Phase B lint (no service-role client in request handlers)
        run: bash ../scripts/check_no_raw_sb.sh
      - name: Unit tests
        # tests_user_admin.py is an integration test against the real
        # Supabase project and needs its credentials; it is run locally.
        run: python -m pytest --ignore=tests_user_admin.py
